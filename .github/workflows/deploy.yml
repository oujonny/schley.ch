# Beta / staging: https://beta.schleyconsult.ch
# For developers: test new features and show them to the customer before release.
# CMS drafts (cms/**) do NOT deploy here - they go to preview.schleyconsult.ch
# (deploy_preview.yml).
name: Deploy to beta.schleyconsult.ch

on:
  push:
    branches: ["development"]

  # Manual: Actions -> "Deploy to beta.schleyconsult.ch" -> Run workflow -> pick any
  # branch (e.g. a feature branch) to show it on beta.
  workflow_dispatch:

# Own group per site, so a beta deploy never cancels a production or preview deploy.
concurrency:
  group: "deploy-beta"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.170.1'
          extended: true
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Cache Hugo build
        uses: actions/cache@v6
        with:
          path: /tmp/hugo_cache
          key: ${{ runner.os }}-hugo-build-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-hugo-build-
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --noBuildLock --cacheDir /tmp/hugo_cache --baseURL https://beta.schleyconsult.ch/
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
      - name: Deploy
        env:
          SSH_USER: "toxykiwo"
          HOST: "s106.cyon.net"
          DIR: "public_html/beta.schleyconsult.ch/"
        run: rsync -avz --delete-during public/ ${SSH_USER}@${HOST}:~/${DIR}
